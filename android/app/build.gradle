plugins {
    id 'com.android.application'
}

android {
    namespace 'com.instachat.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.instachat.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly by sideloading.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
